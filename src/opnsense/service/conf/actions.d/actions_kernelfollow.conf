#
# The page's three questions. errors:no on each, because follow.sh exits 1 when a module could not be
# rebuilt, and configd would then throw away the very output that says why; 2>&1 because its warnings
# go to stderr.

[status]
command:/usr/local/opnsense/scripts/kernelfollow/status.py
parameters:
errors:no
type:script_output
message:reading the kernel follower

# What a run would do, changing nothing. Reading the kernel and the stamps takes seconds.
[check]
command:/usr/bin/env DRY=1 /bin/sh /usr/local/opnsense/scripts/kernelfollow/follow.sh 2>&1
parameters:
errors:no
type:script_output
message:checking the modules against the kernel to follow

# A run now, although the setting may be off. A fetch and a build take minutes - longer than a page
# waits - so the page starts it detached and reads what it wrote, in last-run.log, through [status].
[run]
command:/usr/bin/env ANYWAY=1 /bin/sh /usr/local/opnsense/scripts/kernelfollow/follow.sh > /var/db/os-kernelfollow/last-run.log 2>&1
parameters:
errors:no
type:script
message:following the kernel now
